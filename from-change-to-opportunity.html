const real={
shopify:{name:'Shopify',origin:'In 2004, its founders tried to sell snowboards online. The store software was the problem.',business:'Software that helps other companies run their online stores.',metric:'≈ US$190B',metricLabel:'Stock market value, 12 Nov 2026',additional:'US$119B in products sold through Shopify stores in Q3 2026. That is merchants’ sales, not Shopify revenue.',pays:'Merchants pay subscription and service fees.',grow:'One platform can support many shops.',limit:'Competition and ongoing product costs.',lesson:'A problem inside one small business became a product for other businesses.',link:'https://www.shopify.com/news/shopify-q3-2026-financial-results',metricLink:'https://stockanalysis.com/stocks/shop/market-cap/'},

function caseTile(key){const c=real[key];return `<article class="card"><div class="case-visual ${c.color}"><span class="symbol">${c.symbol}</span><span class="wordmark">REAL BUSINESS</span></div><h3>${c.name}</h3><p>${c.problem}</p><div class="source"><a href="${c.link}" target="_blank" rel="noopener">Read the source</a></div></article>`}

function opening(){const lens={customers:['Customers','Pay less for food that would otherwise be wasted.'],shops:['Shops','Recover some income from unsold food.'],society:['Community','Throw away less edible food.'],founder:['Entrepreneur','Earn money if the service creates enough value to cover costs.']};const v=lens[store.valueLens];return slide(`<p class="overline">The big question</p><h1>Entrepreneurship creates value.<br><span class="accent">But for whom?</span></h1><p class="lead">Markets keep changing. This lesson: how entrepreneurs turn those changes into opportunities.</p><div class="scenario-banner" style="margin-bottom:14px">Imagine a service that connects shops with people who want to buy unsold food.</div><div class="value-choices">${Object.entries(lens).map(([k,a])=>choose('valueLens',k,a[0],store.valueLens===k?a[1]:'Explore the benefit')).join('')}</div><div class="value-focus fade-up">${v?`<strong>${v[0]}:</strong> ${v[1]}`:'One business can create different kinds of value for different people.'}</div><p class="handoff">Value is our starting point. Next, the three questions we will explore today.</p>`) }
function start(){return slide(`<p class="overline">A problem becomes an opportunity · Shopify</p><h2>Shopify was born while its founders were selling snowboards.</h2><p class="shortlead">As more shopping moved online, they discovered how hard it was to set up a good online store.</p><div class="three"><div class="card"><div class="eyebrow">2004 · Original plan</div><h3>Sell snowboards</h3><p>The founders needed a shop online. The available software did not work well for them.</p></div><div class="card"><div class="eyebrow">2006 · Bigger opportunity</div><h3>Help other sellers</h3><p>They built Shopify so other businesses could set up and run online stores.</p></div><div class="card"><div class="eyebrow">November 2026 · Scale</div><div class="impact-number">≈ $190B</div><p>Stock market value. Shopify merchants sold <b>$119B</b> in goods during Q3 2026.</p></div></div><div class="context-band"><strong>Why it mattered:</strong> One shop needed better software. Many other shops had the same need. Merchants were willing to pay for a useful service.</div><p class="smallnote">US dollars. Market values change daily. $119B is merchandise sold by merchants, not Shopify revenue. <a target="_blank" rel="noopener" href="https://www.shopify.com/news/shopify-q3-2026-financial-results">Shopify results</a> · <a target="_blank" rel="noopener" href="https://stockanalysis.com/stocks/shop/market-cap/">Market value</a></p><p class="handoff">That was a commercial problem. Could an environmental or healthcare challenge also lead to a business?</p>`) }
function cases(){const c=real[store.case];return slide(`<p class="overline">Different opportunities · Same questions</p><h2>Value can take different forms.</h2><p class="shortlead">Compare who benefits, who pays and what makes growth possible.</p><div class="strip" style="margin:0 0 12px">${Object.entries(real).map(([k,v])=>`<button class="${store.case===k?'primary':'secondary'}" onclick="buttonSelect('case','${k}')">${v.name}</button>`).join('')}</div><div class="cols casegrid"><div class="card"><div class="eyebrow">${c.name} · Its beginning</div><p style="font-size:19px;color:var(--ink)">${c.origin}</p><div style="height:11px"></div><div class="eyebrow">The new value</div><p>${c.business}</p><div class="context-band" style="font-size:17px;margin-top:12px"><strong>Takeaway:</strong> ${c.lesson}</div></div><div class="card"><div class="eyebrow">Scale today</div><div class="impact-number">${c.metric}</div><p style="font-size:17px">${c.metricLabel}</p><p style="font-size:16px;margin-top:9px">${c.additional}</p><ul class="compact-lines" style="margin-top:7px"><li><b>Who pays?</b> ${c.pays}</li><li><b>How can it grow?</b> ${c.grow}</li><li><b>What makes it hard?</b> ${c.limit}</li></ul><div class="source"><a href="${c.link}" target="_blank" rel="noopener">Company information</a> · <a href="${c.metricLink}" target="_blank" rel="noopener">Scale metric</a></div></div></div><p class="handoff">These figures show how far businesses have come. They do not show what the founders knew at the beginning. How could they test demand early?</p>`) }
function evidence(){const items=[{k:'likes',title:'800 likes on a video',desc:'People show interest.'},{k:'interviews',title:'25 people describe the problem',desc:'You hear about their experiences.'},{k:'payments',title:'12 people pay to try it',desc:'They take action and spend money.'}];return slide(`<p class="overline">From an idea to evidence</p><h2>How do we know people really want it?</h2><p class="lead">Imagine a new service. Which result gives the clearest sign that people might pay?</p><div class="three">${items.map(x=>choose('evidence',x.k,x.title,x.desc)).join('')}</div>${store.evidence?`<div class="quiz-feedback fade-up"><b>${store.evidence==='payments'?'Payment is the strongest sign here.':store.evidence==='interviews'?'Useful information, but not yet a purchase.':'Likes are easy to give and easy to forget.'}</b><div style="margin-top:5px">Even 12 paying customers do not prove a large market. You still need to see who returns, what they spend and whether the business works.</div></div>`:''}<p class="smallnote" style="margin-top:12px">Illustrative numbers, not a real start-up.</p><p class="handoff">Airbnb also began with very small numbers. What could its first bookings tell the founders?</p>`) }
function airbnbProof(){const shown=store.airbnbRevealed;return slide(`<p class="overline">Real early evidence · Airbnb</p><h2>Two bookings. Would you continue?</h2><p class="shortlead">Airbnb began by offering travellers a place to stay in someone else's home. The team tried its idea around major events.</p><div class="three"><div class="card"><div class="eyebrow">March 2008 · SXSW</div><div class="impact-number">2</div><p>Bookings during an early launch.</p></div><div class="card"><div class="eyebrow">August 2008 · Denver event</div><div class="impact-number">${shown?'80':'?'}</div><p>${shown?'Bookings at a later event.':'What happened when they tried again?'}</p>${!shown?'<div class="ctas" style="margin-top:10px"><button class="primary" onclick="store.airbnbRevealed=true;render()">Reveal</button></div>':''}</div><div class="card"><div class="eyebrow">By 2026 · Reach</div><div class="impact-number">2.5B+</div><p>Cumulative guest arrivals. About <b>$106B</b> stock market value on 11 Nov 2026.</p></div></div>${shown?`<div class="context-band"><strong>What does the evidence tell us?</strong> Some guests booked, especially during large events. It did not yet prove steady year-round demand.</div>`:''}<p class="smallnote" style="margin-top:10px"><a href="https://news.airbnb.com/about-us" target="_blank" rel="noopener">Airbnb company information</a> · <a href="https://stockanalysis.com/stocks/abnb/market-cap/" target="_blank" rel="noopener">Market value, 11 Nov 2026</a>. These two events had different conditions; the bookings cannot be treated as a growth rate.</p><p class="handoff">Finding paying customers is one test. Serving many more customers at a reasonable cost is another.</p>`) }
function scaling(){return slide(`<p class="overline">From customer demand to growth</p><h2>More customers. How much more work?</h2><p class="shortlead">Scalability means growth without costs rising just as quickly. Not every good business needs to scale fast.</p><div class="cols"><article class="card"><div class="eyebrow">Zipline · Deliveries</div><h3>Each delivery needs a flight.</h3><div class="scale-row"><span>Deliveries</span><div class="barbox"><div class="barfill orange" style="width:80%"></div></div><span>↑</span></div><div class="scale-row"><span>Work needed</span><div class="barbox"><div class="barfill orange" style="width:65%"></div></div><span>↑</span></div><p class="mini">More customers can mean more aircraft, hubs, maintenance and staff. That can still be a strong business.</p></article><article class="card"><div class="eyebrow">Shopify · Software</div><h3>The same software serves many stores.</h3><div class="scale-row"><span>Merchants</span><div class="barbox"><div class="barfill" style="width:86%"></div></div><span>↑</span></div><div class="scale-row"><span>Extra work</span><div class="barbox"><div class="barfill" style="width:28%"></div></div><span>↗</span></div><p class="mini">Software can be reused. New customers still create sales, technical and support costs.</p></article></div><p class="smallnote" style="margin-top:10px">The bars illustrate a principle, not actual company figures.</p><p class="handoff">Move the slider next to see why revenue, staffing and profit may grow at different rates.</p>`) }
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
function scaleSim(){const n=Number(store.scale);const serviceRev=n*80,serviceVariable=n*70,serviceFixed=3000;const platformRev=n*20,platformVariable=n*3,platformFixed=6000;const sv=serviceRev-serviceVariable-serviceFixed,pv=platformRev-platformVariable-platformFixed;const staff=Math.ceil(n/40);const platformTeam=n<=1000?2:3;return slide(`<p class="overline">Try it · A made-up business comparison</p><h2>More customers. More staff? More profit?</h2><div class="card" style="padding:16px 23px;margin-bottom:14px"><div class="range-head"><label for="customerRange">Monthly customers</label><span class="big-number" style="font-size:33px;color:var(--blue)" id="sliderValue">${n.toLocaleString()}</span></div><input id="customerRange" class="range" type="range" min="100" max="1500" step="100" value="${n}" oninput="slideScale(this.value)"><div class="flex-between small"><span>100</span><span>1,500</span></div></div><div class="comparison"><div class="model"><div class="eyebrow">Staff-led service</div><h3>${staff} staff needed</h3><div class="eq">$80 per customer; $70 to serve each, plus $3,000 in fixed costs</div><div class="barbox"><div id="servicebar" class="barfill orange" style="width:${Math.min(100,staff/40*100)}%"></div></div><div class="result ${sv<0?'negative':'positive'}" id="serviceprofit">${money(sv)}</div><div class="metric">Monthly profit or loss · Illustration</div></div><div class="model"><div class="eyebrow">Software business</div><h3><span id="platformStaff">${platformTeam}</span> team members</h3><div class="eq">$20 per customer; $3 to serve each, plus $6,000 in fixed costs</div><div class="barbox"><div id="appbar" class="barfill" style="width:${Math.min(100,platformTeam/40*100)}%"></div></div><div class="result ${pv<0?'negative':'positive'}" id="platformprofit">${money(pv)}</div><div class="metric">Monthly profit or loss · Illustration</div></div></div><p class="handoff">Higher demand changes the economics. Yet even a scalable model can fail if customers do not want it.</p><div class="small" style="margin-top:12px">Illustration only, not Shopify or Zipline data. Service costs include staff time; one employee handles 40 customers a month. Other costs and marketing are simplified.</div>`)}
function slideScale(v){store.scale=+v;const n=+v;document.getElementById('sliderValue').textContent=n.toLocaleString();const s=Math.ceil(n/40),p=n<=1000?2:3;document.getElementById('servicebar').style.width=Math.min(100,s/40*100)+'%';document.getElementById('appbar').style.width=Math.min(100,p/40*100)+'%';document.getElementById('serviceprofit').textContent=money(n*10-3000);document.getElementById('platformprofit').textContent=money(n*17-6000);document.getElementById('platformStaff').textContent=p;document.getElementById('serviceprofit').className='result '+(n*10-3000<0?'negative':'positive');document.getElementById('platformprofit').className='result '+(n*17-6000<0?'negative':'positive');const serviceStaffElem=document.querySelector('.model h3');if(serviceStaffElem)serviceStaffElem.textContent=s+' staff needed'}
function funding(){return slide(`<p class="overline">Funding can open doors</p><h2>Money can help an idea grow.<br><span class="accent">It cannot create demand.</span></h2><p class="shortlead">Investment can make expensive new solutions possible. It can also attract founders to promising sectors. But investors can be wrong.</p><div class="cols"><div class="card"><div class="eyebrow">Quibi · United States, 2020</div><h3>$1.75 billion raised</h3><p>Quibi offered short videos made for smartphones. It launched in April 2020 and announced its closure six months later.</p><div class="source"><a href="https://www.spglobal.com/market-intelligence/en/news-insights/research/quibis-2-billion-bet-on-mobile-video-fizzles-out" target="_blank" rel="noopener">S&amp;P Global Market Intelligence</a></div></div><div class="card"><div class="eyebrow">What does this tell us?</div>${choose('quibi','proof','Investors proved the market','Large amounts of money were raised.')}${choose('quibi','notproof','Demand was still unproven','Customers still had to choose the service.')}</div></div>${store.quibi?`<div class="context-band"><strong>${store.quibi==='notproof'?'Exactly.':'That is not enough.'}</strong> Funding may cover development, expansion and losses while a business learns. It does not guarantee repeat customers.</div>`:''}<p class="handoff">If you had only a small budget, what would you test before asking for more money?</p>`) }
function challenge(){return slide(`<p class="overline">Put the whole lesson to work · Fictional case</p><h2>Could you create a business from unsold food?</h2><p class="shortlead">Return to our opening idea. Imagine 20 shops are interested in selling surplus food. You have a small budget, but no customer sales yet.</p><div class="three">${choose('firstMove','app','Build an app','Launch a polished product for everyone.')}${choose('firstMove','pilot','Run a paid trial','Try a simple service with shops and real buyers.')}${choose('firstMove','sponsor','Look for investors','Raise money before testing customers.')}</div>${store.firstMove?`<div class="context-band"><strong>${store.firstMove==='pilot'?'A way to learn quickly.':store.firstMove==='app'?'You could spend a lot before learning.':'Funding might help later.'}</strong> ${store.firstMove==='pilot'?'See whether people buy, collect and come back.':store.firstMove==='app'?'First check that buyers and shops will actually use the service.':'Investors will also want to see that customers need it.'}</div>`:''}<p class="handoff">Now imagine you ran a two-week trial. The results challenge your first assumptions.</p><p class="smallnote">This case is fictional and does not show Too Good To Go’s actual results.</p>`) }
function pilot(){return slide(`<p class="overline">The evidence changes the decision · Fictional case</p><h2>People paid. But a problem appeared.</h2><p class="shortlead">Two weeks, one neighbourhood. You tested discounted surplus food with local shops.</p>${!store.pilotShown?`<div class="linehero"><div class="ring"></div><h2 style="font-size:32px">What happened during the trial?</h2><p>The team tracked shop participation, paid orders and whether buyers collected their food.</p><div class="ctas"><button class="primary" onclick="store.pilotShown=true;render()">Reveal the results</button></div></div>`:`<div class="mosaic fade-up"><div class="tile"><div class="num">9/20</div><div class="txt">shops joined</div></div><div class="tile"><div class="num">26</div><div class="txt">paid orders</div></div><div class="tile"><div class="num" style="color:var(--coral)">8/26</div><div class="txt">orders not collected</div></div></div><div class="context-band"><strong>Good sign:</strong> Shops joined and buyers paid. <strong>Concern:</strong> Nearly one in three orders was not collected. What is going wrong?</div><div class="ctas" style="margin-top:10px"><button class="secondary" onclick="store.pilotShown=false;render()">Hide results</button></div>`}<p class="handoff">You have value for some stakeholders and early payment evidence. But can the service work reliably when it grows?</p><p class="smallnote">All numbers are invented for this classroom activity.</p>`) }
function finalDecision(){const responses={expand:['Grow now','More shops may bring more orders, but the missed pickups could grow too.'],retest:['Improve and test again','Find out why buyers missed collection, test a fix and check repeat orders before expanding.'],stop:['Stop for now','You could stop if the economics will never work. But two weeks is too little evidence for that conclusion.']};return slide(`<p class="overline">Your decision · Fictional case</p><h2>Would you grow this business now?</h2><p class="lead">Nine shops joined and 26 people paid. But eight orders were not collected.</p><div class="three">${choose('decision','expand','Grow to 100 shops','Try to reach more people now.')}${choose('decision','retest','Improve and test again','Understand missed pickups first.')}${choose('decision','stop','End the project','Avoid spending more money.')}</div>${store.decision?`<div class="quiz-feedback fade-up"><b>${responses[store.decision][0]}</b><div style="margin-top:6px">${responses[store.decision][1]}</div></div>`:''}<p class="handoff">The decision is not about having the boldest idea. It is about value, evidence, cost and what you have learned.</p>`) }
function conclusion(){return slide(`<p class="overline">The full argument</p><h2>When is an opportunity <span class="teal">worth pursuing?</span></h2><p class="shortlead">A changing world makes new things possible. Entrepreneurship turns some of those possibilities into value.</p><div class="three"><div class="card"><div class="eyebrow">1 · Value</div><h3>Who benefits?</h3><p>Customers, organisations, society, and the people funding or running the business.</p></div><div class="card"><div class="eyebrow">2 · Evidence</div><h3>Does anyone act?</h3><p>A real need, customer behaviour, payment and repeat use matter more than enthusiasm.</p></div><div class="card"><div class="eyebrow">3 · Delivery and growth</div><h3>Can it work?</h3><p>Consider costs, alternatives, funding and how the business could grow.</p></div></div><div class="context-band"><strong>Remember:</strong> Not every opportunity starts with a problem. Not every valuable problem makes a good business. Not every good business needs to become a giant.</div><p class="handoff">Next step: understand customers more deeply, then use Lean Canvas to examine the business model.</p>`) }

</div><p class="handoff">First, how have changes in the world created new opportunities?</p>`)}
function worldChanges(){const events={trade:{title:'1990s · Global trade and supply chains',shift:'Businesses gained more ways to source goods and sell across borders, while competition also increased.',opening:'Specialised suppliers, logistics and cross-border services became more valuable.'},internet:{title:'2000s · Internet access expands',shift:'In 2005, about one in six people used the internet worldwide. By 2025, it was nearly three in four.',opening:'Smaller businesses could reach distant customers. New software could help them sell and operate online.'},crisis:{title:'2008–09 · Global financial crisis',shift:'Bank lending tightened in many countries. Smaller firms found it harder to get the money needed to operate or grow.',opening:'Start-ups needed to pay closer attention to cash, costs and early proof of demand.'},pandemic:{title:'2020 · COVID-19 pandemic',shift:'Many businesses and customers moved more activities online. Working, shopping and learning changed quickly.',opening:'Remote services, online tools and delivery became more important to more organisations.'},today:{title:'2020s · AI and resource pressures',shift:'AI and automation offer new tools, while energy and environmental pressures create different needs.',opening:'Firms can develop new services in automation, efficiency, monitoring and resource management.'}};const r=events[store.era];return slide(`<p class="overline">Big shifts create openings</p><h2>How have major changes reshaped entrepreneurship?</h2><p class="shortlead">Select a period to see what changed and what became possible.</p><div class="event-tabs">${Object.entries(events).map(([k,v])=>`<button class="event-choice ${store.era===k?'current':''}" onclick="buttonSelect('era','${k}')"><span>${{trade:'1990s',internet:'2000s',crisis:'2008–09',pandemic:'2020',today:'2020s'}[k]}</span><small>${{trade:'Global trade',internet:'Internet',crisis:'Financial crisis',pandemic:'Pandemic',today:'AI and resources'}[k]}</small></button>`).join('')}</div><div class="cols macro-results fade-up"><div class="card"><div class="eyebrow">What changed?</div><h3>${r.title}</h3><p>${r.shift}</p></div><div class="card"><div class="eyebrow">What became possible?</div><p style="font-size:20px;color:var(--ink)">${r.opening}</p></div></div><p class="smallnote" style="margin-top:8px">Sources: <a href="https://www.itu.int/en/ITU-D/Statistics/Pages/stat/default.aspx" target="_blank" rel="noopener">ITU</a> (internet adoption), <a href="https://www.oecd.org/en/publications/financing-smes-and-entrepreneurs-2020_061fe03d-en/full-report/component-8.html" target="_blank" rel="noopener">OECD</a> (2008 credit conditions), <a href="https://www.oecd.org/en/publications/oecd-sme-and-entrepreneurship-outlook-2021_97a5bbfe-en/full-report/component-11.html" target="_blank" rel="noopener">OECD</a> (pandemic digitalisation).</p><p class="handoff">These shifts create possibilities, not automatic success. Which needs are important enough for someone to support a solution?</p>`) }
function worthSolving(){return slide(`<p class="overline">From change to opportunity</p><h2>Are there problems worth solving?</h2><p class="shortlead">Yes. But a problem is not automatically a business. First ask whether it matters enough to someone.</p><div class="cols"><div class="card"><div class="eyebrow">What to look for</div><ul class="simplelist"><li><strong>Who needs this fixed?</strong> Who is affected?</li><li><strong>How serious is it?</strong> Time, money or risk.</li><li><strong>What exists already?</strong> How do people cope?</li><li><strong>Who pays?</strong> It may not be the person who benefits.</li></ul></div><div class="card"><div class="eyebrow">A quick decision · Fictional example</div><h3>A retailer keeps losing online orders.</h3><p style="margin-bottom:15px">The shop says its checkout fails every week.</p>${choose('problemTest','build','Build the solution now','One person has a serious complaint.')}${choose('problemTest','learn','Check before building','Talk to more shops and observe what fails.')}${store.problemTest?`<div class="quiz-feedback fade-up" style="font-size:17px;margin-top:5px">${store.problemTest==='learn'?'Find out how often it happens and whether other shops face it too.':'One complaint does not tell you how many customers need it.'}</div>`:''}</div></div><p class="handoff">Not all opportunities fix problems. Shopify did begin with a problem its founders knew well.</p>`) }
const slides=[opening,learningOutcomes,worldChanges,worthSolving,start,cases,evidence,airbnbProof,scaling,scaleSim,funding,challenge,pilot,finalDecision,conclusion,sources];
function render(){document.getElementById('app').innerHTML=slides[index]();document.getElementById('count').textContent=String(index+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');document.getElementById('pbar').style.width=((index+1)/slides.length*100)+'%';document.getElementById('back').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('footlabel').textContent=labels[index];document.getElementById('dots').innerHTML=slides.map((_,i)=>`<span class="dot ${i===index?'active':''}"></span>`).join('')}
document.addEventListener('keydown',e=>{const tag=e.target?.tagName?.toLowerCase();if(['input','textarea'].includes(tag))return;if(e.key==='ArrowRight'){next()}if(e.key==='ArrowLeft'){back()}if(e.key==='Escape'){closeMenu()}});
render();
